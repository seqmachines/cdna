[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdna-engine"
version = "0.2.0"
description = "Deterministic symbolic molecular skills for sequencing-library workflows."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cdna-mcp = "cdna.mcp_server:main"

[tool.setuptools]
packages = ["cdna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
